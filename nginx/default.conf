# Basic per-client rate limit: 20 req/s with a burst of 40.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_req_status 429;

# Re-resolve the app container via Docker DNS, so a recreated container (new IP) is picked up
# without restarting nginx (`resolve` in upstream requires nginx >= 1.27.3).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream app {
    zone app 64k;
    server app:8000 resolve;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/plain text/css application/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Enable once TLS is terminated here or in front of nginx:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Prometheus scrapes the app directly inside the docker network; never expose metrics publicly.
    location = /metrics {
        return 404;
    }

    # nginx's own liveness probe (used by the container healthcheck).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_req zone=per_ip burst=40 nodelay;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
