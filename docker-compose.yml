# Run with: docker compose -p devops-template up -d --build   (or simply `make up`)
# Only nginx (HTTP_PORT, default 80) and grafana (GRAFANA_PORT, default 3000) are published.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  app:
    <<: *hardening
    image: ${APP_IMAGE:-devops-template-app}:${APP_TAG:-latest}
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    # Uvicorn drains in-flight requests on SIGTERM (--timeout-graceful-shutdown 20).
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  db:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  nginx:
    <<: *hardening
    image: nginx:1.29-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [frontend, backend]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.7.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  grafana:
    <<: *hardening
    image: grafana/grafana:12.2.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks: [frontend, backend]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  backup:
    <<: *hardening
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # Healthy while the newest dump is younger than two backup intervals.
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name '*.dump' -mmin -$$((BACKUP_INTERVAL_SECONDS * 2 / 60 + 1)) | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [backend]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

networks:
  frontend:
  backend:
    internal: true   # no direct internet access for app, db, prometheus, backup

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  backups:
